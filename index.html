<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprendre Vue.js</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">


<body>
    <div id="app">
        <div class="card">
            <h2>Nos Produits</h2>
            
            <ul>
                <li v-for="product in products">
                    {{ product }}
                </li>
            </ul>
        </div>
        <div class="card">
            <h2>Nos produits avec prix</h2>
            <ul>
                <li v-for="item in items"
                :key="item.id">
                    {{ item.name }}
                    <br> 
                    {{ item.price }} CHF
                </li>
            </ul>
        </div>
    </div>

    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    products : [
                        'Chaussures',
                        'Chaussettes',
                        'T-shirt',
                        'Pantalon',
                        'Veste',
                        'Pull-over'
                    ],

                    items : [
                        { id: 1, name : 'Chaussures', price: 50 },
                        { id: 2, name : 'Chaussettes', price: 5 },
                        { id: 3, name : 'T-shirt', price: 20 },
                        { id: 4, name : 'Pantalon', price: 40 },
                        { id: 5, name : 'Veste', price: 80 },
                        { id: 6, name : 'Pull-over', price: 60 }
                    ]
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
